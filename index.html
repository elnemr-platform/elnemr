<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة النمر – الاختبارات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1d2433;--muted:#667085;--brand:#4f46e5;--brand2:#06b6d4;--ok:#16a34a;--bad:#dc2626;--line:#e5e7ef}
@media(prefers-color-scheme:dark){:root{--bg:#0f1220;--card:#181c30;--text:#eef0f8;--muted:#98a0b8;--brand:#818cf8;--brand2:#22d3ee;--line:#2a3050}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Cairo',Tahoma,Arial,sans-serif;line-height:1.8}
.wrap{max-width:900px;margin:auto;padding:0 16px 40px}
header{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:32px 16px 52px;text-align:center}
header h1{margin:0 0 6px;font-size:clamp(1.6rem,5vw,2.3rem);font-weight:800}header p{margin:0}
nav{display:flex;gap:8px;overflow-x:auto;margin:-28px auto 20px;max-width:900px;padding:0 16px}
nav button{flex:1;min-width:120px;border:0;border-radius:14px;padding:12px;background:var(--card);color:var(--text);font:600 1rem 'Cairo',Tahoma,sans-serif;cursor:pointer;box-shadow:0 4px 14px #0002}
nav button.on{background:var(--brand);color:#fff}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
h2{margin:8px 0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.btn{display:inline-block;border:0;border-radius:10px;padding:8px 16px;background:var(--brand);color:#fff;font:600 .95rem 'Cairo',Tahoma,sans-serif;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;cursor:pointer}
.tag{font-size:.85rem;color:var(--muted)}
.opt{display:block;width:100%;text-align:right;margin:8px 0;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font:inherit;cursor:pointer}
.opt.sel{border-color:var(--brand);background:#4f46e522}
div.opt{cursor:default}.opt.right{border-color:var(--ok);background:#16a34a22}.opt.wrong{border-color:var(--bad);background:#dc262622}
.score{font-size:2.4rem;font-weight:800;text-align:center;color:var(--brand)}
.sticky{position:sticky;top:0;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:12px;display:flex;justify-content:space-between;font-weight:600}
.mi{max-width:100%;max-height:360px;border-radius:12px;margin:8px 0;display:block}
.yt{position:relative;aspect-ratio:16/9;margin:8px 0}.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:12px}
.f input,.f textarea,.f select{width:100%;padding:10px;margin:4px 0 10px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:inherit}
.f label{font-weight:600;font-size:.95rem}.f .ck{display:flex;gap:8px;align-items:center;margin:6px 0}.f .ck input{width:auto;margin:0}
table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:right}.scroll{overflow-x:auto}
#login{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:16px}
#login .box{width:100%;max-width:380px;text-align:center}
#login input{width:100%;padding:12px;margin:6px 0;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font:inherit;text-align:center}
#login .row{display:flex;gap:8px;margin-top:8px}#login .row .btn{flex:1;padding:12px}
#msg{color:var(--bad);min-height:1.6em;font-size:.9rem}
</style>
</head>
<body>
<header><h1>🐯 منصة النمر</h1><p>اختبارات تفاعلية</p><div id="ub" style="margin-top:8px"></div></header>
<nav id="nav"></nav>
<div class="wrap"><section id="ex"></section><section id="mg"></section><section id="rs"></section></div>
<div id="login"><div class="card box"><div style="font-size:3rem">🐯</div><h2 style="margin:0">منصة النمر</h2>
<input id="nm" placeholder="الاسم (للحساب الجديد فقط)"><input id="em" type="email" placeholder="البريد الإلكتروني" dir="ltr"><input id="pw" type="password" placeholder="كلمة السر (6 أحرف على الأقل)" dir="ltr">
<div id="msg"></div><div class="row"><button class="btn" id="lg">دخول</button><button class="btn" id="rg" style="background:var(--brand2)">حساب جديد</button></div></div></div>
<script>
/* انسخ السطرين من ملفك القديم */
const SUPABASE_URL="https://ajrnnmiszknzapazqfsn.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFqcm5ubWlzemtuemFwYXpxZnNuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0MzI3NTIsImV4cCI6MjExMDAwODc1Mn0.7EvUzg0wooM1bfm-u_l925hhO6TkEuXvcVqv5XooLuM";

const $=s=>document.querySelector(s);
const esc=s=>{const d=document.createElement("div");d.textContent=s??"";return d.innerHTML.replace(/"/g,"&quot;")};
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let me=null,isT=false,exams=[],sess=null,tmr=null,curEx=null,nQ=0;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const ytId=u=>{const m=String(u).match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);return m?m[1]:null};
function media(q){if(!q.media_url)return"";const u=esc(q.media_url);
 if(q.media_type==="image")return `<img class="mi" src="${u}" alt="">`;
 if(q.media_type==="video")return `<video class="mi" src="${u}" controls playsinline></video>`;
 if(q.media_type==="youtube"){const id=ytId(q.media_url);return id?`<div class="yt"><iframe src="https://www.youtube-nocookie.com/embed/${id}" allowfullscreen loading="lazy"></iframe></div>`:""}
 return""}

/* التنقل */
function buildNav(){const t=[["ex","✅ الاختبارات"]];if(isT)t.push(["mg","🛠 إدارة الاختبارات"],["rs","📊 النتائج"]);$("#nav").innerHTML=t.map(x=>`<button data-t="${x[0]}">${x[1]}</button>`).join("")}
function show(id){
 if(sess&&!sess.sent){if(!confirm("سيتم إلغاء الاختبار الحالي. هل أنت متأكد؟"))return;sess=null;clearInterval(tmr)}
 ["ex","mg","rs"].forEach(t=>$("#"+t).classList.toggle("on",t===id));
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===id));
 if(id==="ex")listExams();if(id==="mg")manage();if(id==="rs")results()}
$("#nav").onclick=e=>{if(e.target.dataset.t)show(e.target.dataset.t)};
window.addEventListener("beforeunload",e=>{if(sess&&!sess.sent){e.preventDefault();e.returnValue=""}});

/* ===== الطالب: قائمة الاختبارات ===== */
async function listExams(){
 const el=$("#ex");el.innerHTML="<h2>الاختبارات</h2><p class='tag'>جاري التحميل...</p>";
 const [a,b]=await Promise.all([sb.from("exams").select("*,questions(count)").eq("published",true).order("created_at",{ascending:false}),sb.from("results").select("exam_id,score,total").eq("user_id",me.id).not("exam_id","is",null)]);
 if(a.error){el.innerHTML="<h2>الاختبارات</h2><p>تعذّر التحميل</p>";return}
 const mine={};(b.data||[]).forEach(r=>{const p=Math.round(r.score/r.total*100);if(mine[r.exam_id]==null||p>mine[r.exam_id])mine[r.exam_id]=p});
 exams=a.data||[];
 el.innerHTML="<h2>الاختبارات</h2>"+(exams.length?"<div class='grid'>"+exams.map(e=>{const n=e.questions?.[0]?.count||0,done=mine[e.id]!=null,lock=e.one_attempt&&done;
  return `<div class="card"><b>${esc(e.title)}</b><div class="tag">${esc(e.subject||"")} · ${n} سؤال${e.minutes?" · "+e.minutes+" دقيقة":""}${e.one_attempt?" · محاولة واحدة":""}</div>${done?`<div class="tag">نتيجتك: ${mine[e.id]}%</div>`:""}<br><button class="btn" data-start="${e.id}" ${lock||!n?"disabled":""}>${lock?"تم الحل":"ابدأ"}</button></div>`}).join("")+"</div>":"<p>لا توجد اختبارات متاحة الآن.</p>")}
async function start(id){
 const e=exams.find(x=>x.id==id);
 if(e.one_attempt&&!confirm("هذا الاختبار له محاولة واحدة فقط. هل تريد البدء؟"))return;
 const {data:qs,error}=await sb.from("questions").select("id,q,options,media_type,media_url").eq("exam_id",id).order("pos").order("id");
 if(error||!qs.length){alert("تعذّر تحميل الأسئلة");return}
 let list=qs.map(q=>({...q,opts:q.options.map((t,i)=>({t,i}))}));
 if(e.shuffle)list=shuffle(list).map(q=>({...q,opts:shuffle(q.opts)}));
 sess={e,list,ans:{},end:e.minutes?Date.now()+e.minutes*60000:0,sent:false};
 renderExam();tick()}
function renderExam(){const {e,list}=sess;
 $("#ex").innerHTML=`<div class="sticky"><span>${esc(e.title)}</span><span id="tm"></span></div>`+list.map((q,n)=>`<div class="card"><div class="tag">سؤال ${n+1} من ${list.length}</div><h3>${esc(q.q)}</h3>${media(q)}${q.opts.map(o=>`<button class="opt" data-q="${q.id}" data-i="${o.i}">${esc(o.t)}</button>`).join("")}</div>`).join("")+`<button class="btn" id="sub" style="width:100%;padding:14px">تسليم الاختبار</button>`;
 window.scrollTo(0,0)}
function tick(){clearInterval(tmr);if(!sess||!sess.end)return;
 const f=()=>{const s=Math.max(0,Math.round((sess.end-Date.now())/1000)),el=$("#tm");if(el)el.textContent="⏱ "+String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");if(s<=0){clearInterval(tmr);submit(true)}};
 f();tmr=setInterval(f,1000)}
async function submit(auto){
 if(!sess||sess.sent)return;
 const un=sess.list.filter(q=>sess.ans[q.id]==null).length;
 if(!auto&&un&&!confirm(`لم تجب على ${un} سؤال. هل تريد التسليم؟`))return;
 sess.sent=true;clearInterval(tmr);
 const {data,error}=await sb.rpc("submit_exam",{p_exam:sess.e.id,p_answers:sess.ans});
 if(error){sess.sent=false;alert("تعذّر التسليم: "+error.message+"\nحاول مرة أخرى.");return}
 const rv={};data.review.forEach(r=>rv[r.id]=r);const p=Math.round(data.score/data.total*100),L=sess.list,A=sess.ans;sess=null;
 $("#ex").innerHTML=`<div class="card" style="text-align:center"><div class="score">${p}%</div><p>${data.score} من ${data.total} ${p>=80?"🎉":p>=50?"👍":"💪"}</p><button class="btn" id="bk">رجوع للاختبارات</button></div>`+L.map((q,n)=>{const r=rv[q.id]||{},ch=A[q.id];return `<div class="card"><div class="tag">سؤال ${n+1}</div><h3>${esc(q.q)}</h3>${media(q)}${q.opts.map(o=>`<div class="opt ${o.i===r.answer?"right":o.i===ch?"wrong":""}">${esc(o.t)}</div>`).join("")}${r.explanation?`<p class="tag">💡 ${esc(r.explanation)}</p>`:""}</div>`}).join("");
 window.scrollTo(0,0)}
$("#ex").onclick=e=>{const t=e.target;
 if(t.dataset.start)start(t.dataset.start);
 else if(t.classList.contains("opt")&&t.dataset.q){sess.ans[t.dataset.q]=+t.dataset.i;document.querySelectorAll(`.opt[data-q="${t.dataset.q}"]`).forEach(b=>b.classList.toggle("sel",b===t))}
 else if(t.id==="sub")submit(false);
 else if(t.id==="bk")listExams()};

/* ===== المدرّس: إدارة الاختبارات ===== */
async function manage(){
 const {data:ex}=await sb.from("exams").select("*,questions(count)").order("created_at",{ascending:false});
 $("#mg").innerHTML=`<h2>إدارة الاختبارات</h2><button class="btn" data-a="new">+ اختبار جديد</button><br><br>`+((ex||[]).map(e=>`<div class="card"><b>${esc(e.title)}</b> <span class="tag">${esc(e.subject||"")} · ${e.questions?.[0]?.count||0} سؤال · ${e.published?"منشور":"مسودة"}</span><br><br><button class="btn" data-a="edit" data-id="${e.id}">الأسئلة</button> <button class="chip" data-a="pub" data-id="${e.id}" data-v="${e.published}">${e.published?"إخفاء":"نشر"}</button> <button class="chip" data-a="delex" data-id="${e.id}">حذف</button></div>`).join("")||"<p>لا توجد اختبارات بعد.</p>")}
function newForm(){$("#mg").innerHTML=`<h2>اختبار جديد</h2><div class="card f"><label>عنوان الاختبار</label><input id="xt"><label>المادة</label><input id="xs"><label>المدة بالدقائق (0 = بدون وقت)</label><input id="xm" type="number" min="0" value="0"><div class="ck"><input id="xh" type="checkbox" checked><label for="xh">ترتيب الأسئلة والاختيارات عشوائي</label></div><div class="ck"><input id="xo" type="checkbox" checked><label for="xo">محاولة واحدة فقط لكل طالب</label></div><p id="xe" style="color:var(--bad)"></p><button class="btn" data-a="savex">حفظ ومتابعة لإضافة الأسئلة</button> <button class="chip" data-a="back">إلغاء</button></div>`}
async function editor(id){
 curEx=id;
 const [a,b]=await Promise.all([sb.from("exams").select("title").eq("id",id).single(),sb.from("questions").select("id,q,options,media_type,answer_keys(answer)").eq("exam_id",id).order("pos").order("id")]);
 const qs=b.data||[];nQ=qs.length;
 $("#mg").innerHTML=`<h2>${esc(a.data?.title||"")}</h2><button class="chip" data-a="back">⬅ رجوع</button><br><br>`+qs.map((q,n)=>{const k=Array.isArray(q.answer_keys)?q.answer_keys[0]:q.answer_keys;return `<div class="card"><b>${n+1}. ${esc(q.q)}</b>${q.media_type?` <span class="tag">(${q.media_type==="youtube"?"فيديو":q.media_type==="video"?"فيديو":"صورة"})</span>`:""}<div class="tag">${q.options.map((o,i)=>(i===k?.answer?"✔ ":"")+esc(o)).join(" | ")}</div><button class="chip" data-a="delq" data-id="${q.id}">حذف السؤال</button></div>`}).join("")+
 `<div class="card f"><h3>إضافة سؤال</h3><label>نص السؤال</label><textarea id="fq" rows="2"></textarea><label>الاختيارات (كل اختيار في سطر، من 2 إلى 6)</label><textarea id="fo" rows="4"></textarea><label>الإجابة الصحيحة</label><select id="fa"></select><label>شرح الإجابة (اختياري)</label><input id="fe"><label>وسائط (اختياري)</label><select id="fm"><option value="none">بدون</option><option value="image_up">رفع صورة</option><option value="video_up">رفع فيديو قصير (حتى 10 ميجا)</option><option value="image">رابط صورة</option><option value="youtube">رابط يوتيوب</option></select><input id="ff" type="file" style="display:none"><input id="fu" placeholder="https://..." dir="ltr" style="display:none"><p id="fx" style="color:var(--bad)"></p><button class="btn" data-a="addq">إضافة السؤال</button></div>`;
 $("#fo").oninput=()=>{const l=$("#fo").value.split("\n").map(s=>s.trim()).filter(Boolean);$("#fa").innerHTML=l.map((t,i)=>`<option value="${i}">${i+1}. ${esc(t.slice(0,40))}</option>`).join("")};
 $("#fm").onchange=()=>{const v=$("#fm").value,f=$("#ff"),u=$("#fu");f.style.display=v.endsWith("_up")?"block":"none";u.style.display=(v==="image"||v==="youtube")?"block":"none";f.accept=v==="image_up"?"image/*":"video/*"}}
async function addQ(){
 const x=$("#fx"),q=$("#fq").value.trim(),opts=$("#fo").value.split("\n").map(s=>s.trim()).filter(Boolean),ans=+$("#fa").value,mt=$("#fm").value;x.textContent="";
 if(!q||opts.length<2||opts.length>6){x.textContent="اكتب السؤال ومن 2 إلى 6 اختيارات";return}
 let url=null,type=null;
 if(mt.endsWith("_up")){const f=$("#ff").files[0];if(!f){x.textContent="اختر ملفاً";return}if(f.size>10*1048576){x.textContent="الملف أكبر من 10 ميجا";return}
  x.style.color="var(--muted)";x.textContent="جاري رفع الملف...";
  const path=`${curEx}/${Date.now()}-${f.name.replace(/[^\w.]/g,"_")}`,up=await sb.storage.from("media").upload(path,f);x.style.color="var(--bad)";
  if(up.error){x.textContent="تعذّر الرفع: "+up.error.message;return}
  url=sb.storage.from("media").getPublicUrl(path).data.publicUrl;type=mt==="image_up"?"image":"video"}
 else if(mt!=="none"){url=$("#fu").value.trim();type=mt;if(!url||(mt==="youtube"&&!ytId(url))){x.textContent="الرابط غير صحيح";return}}
 const r=await sb.from("questions").insert({exam_id:curEx,pos:nQ,q,options:opts,media_type:type,media_url:url}).select("id").single();
 if(r.error){x.textContent=r.error.message;return}
 const k=await sb.from("answer_keys").insert({question_id:r.data.id,answer:ans,explanation:$("#fe").value.trim()||null});
 if(k.error){await sb.from("questions").delete().eq("id",r.data.id);x.textContent=k.error.message;return}
 editor(curEx)}
$("#mg").onclick=async e=>{const t=e.target,a=t.dataset.a,id=t.dataset.id;if(!a)return;
 if(a==="new")newForm();
 else if(a==="back")manage();
 else if(a==="edit")editor(id);
 else if(a==="addq")addQ();
 else if(a==="savex"){const title=$("#xt").value.trim();if(!title){$("#xe").textContent="اكتب العنوان";return}
  const {data,error}=await sb.from("exams").insert({title,subject:$("#xs").value.trim()||null,minutes:Math.max(0,+$("#xm").value||0),shuffle:$("#xh").checked,one_attempt:$("#xo").checked}).select("id").single();
  if(error){$("#xe").textContent=error.message;return}editor(data.id)}
 else if(a==="pub"){await sb.from("exams").update({published:t.dataset.v!=="true"}).eq("id",id);manage()}
 else if(a==="delex"){if(confirm("حذف الاختبار وكل أسئلته؟")){await sb.from("exams").delete().eq("id",id);manage()}}
 else if(a==="delq"){if(confirm("حذف السؤال؟")){await sb.from("questions").delete().eq("id",id);editor(curEx)}}};

/* ===== المدرّس: النتائج ===== */
async function results(){
 $("#rs").innerHTML="<h2>نتائج الطلبة</h2><p class='tag'>جاري التحميل...</p>";
 const [a,b]=await Promise.all([sb.from("results").select("user_id,subject,score,total,created_at").order("created_at",{ascending:false}).limit(1000),sb.from("profiles").select("id,name")]);
 if(a.error){$("#rs").innerHTML="<h2>نتائج الطلبة</h2><p>تعذّر التحميل</p>";return}
 const nm={};(b.data||[]).forEach(p=>nm[p.id]=p.name);
 const rows=(a.data||[]).map(r=>({n:nm[r.user_id]||"-",s:r.subject,p:Math.round(r.score/r.total*100),d:new Date(r.created_at).toLocaleDateString("ar-EG")}));
 const subs=[...new Set(rows.map(r=>r.s))];
 const draw=()=>{const f=$("#rf").value,v=rows.filter(r=>!f||r.s===f);$("#rt").innerHTML="<tr><th>الطالب</th><th>الاختبار</th><th>النتيجة</th><th>التاريخ</th></tr>"+(v.map(r=>`<tr><td>${esc(r.n)}</td><td>${esc(r.s)}</td><td>${r.p}%</td><td>${r.d}</td></tr>`).join("")||"<tr><td colspan=4>لا توجد نتائج</td></tr>");$("#rt").dataset.csv="الطالب,الاختبار,النتيجة,التاريخ\n"+v.map(r=>[r.n,r.s,r.p+"%",r.d].map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n")};
 $("#rs").innerHTML=`<h2>نتائج الطلبة</h2><div class="card"><select id="rf" class="chip"><option value="">كل الاختبارات</option>${subs.map(s=>`<option>${esc(s)}</option>`).join("")}</select> <button class="chip" id="csv">تحميل Excel (CSV)</button></div><div class="card scroll"><table id="rt"></table></div>`;
 $("#rf").onchange=draw;draw();
 $("#csv").onclick=()=>{const l=document.createElement("a");l.href=URL.createObjectURL(new Blob(["\ufeff"+$("#rt").dataset.csv],{type:"text/csv;charset=utf-8"}));l.download="results.csv";l.click()}}

/* ===== الحسابات ===== */
async function enter(user){me=user;
 const {data:p}=await sb.from("profiles").select("name,role").eq("id",user.id).maybeSingle();
 isT=p?.role==="teacher";$("#login").style.display="none";
 $("#ub").innerHTML=`أهلاً يا ${esc(p?.name||"طالب")} 👋 <button class="chip" id="out">خروج</button>`;buildNav();show("ex")}
async function auth(isNew){const m=$("#msg"),email=$("#em").value.trim(),password=$("#pw").value,name=$("#nm").value.trim();m.textContent="";
 if(!email||password.length<6){m.textContent="اكتب بريداً صحيحاً وكلمة سر 6 أحرف على الأقل";return}
 if(isNew){if(!name){m.textContent="اكتب اسمك";return}
  const {data,error}=await sb.auth.signUp({email,password,options:{data:{name}}});
  if(error){m.textContent=error.message;return}
  if(data.session)enter(data.user);else m.textContent="تم إنشاء الحساب، افتح بريدك لتأكيده ثم سجّل دخول"}
 else{const {data,error}=await sb.auth.signInWithPassword({email,password});
  if(error){m.textContent="البريد أو كلمة السر غير صحيحة";return}enter(data.user)}}
$("#lg").onclick=()=>auth(false);$("#rg").onclick=()=>auth(true);
$("#pw").onkeydown=e=>{if(e.key==="Enter")auth(false)};
$("#ub").onclick=async e=>{if(e.target.id==="out"){await sb.auth.signOut();location.reload()}};
sb.auth.getSession().then(({data})=>{if(data.session)enter(data.session.user)});
</script>
